<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校本時間表檢視系統 (教師 / 班別 / 房間)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #27ae60;
            --bg-color: #f8f9fa;
            --warning-bg: #fff3cd;
            --warning-border: #ffeeba;
            --warning-text: #856404;
            --tab-active-bg: #2980b9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Microsoft JhengHei';
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 960px;
            text-align: center;
            box-sizing: border-box;
        }

        /* 系統大分類標籤切換 */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 2px solid #bdc3c7;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn:hover {
            background-color: #dfe6e9;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }

        .upload-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="file"] {
            padding: 8px;
            border: 1px dashed var(--accent-color);
            border-radius: 4px;
            background: #e8f5e9;
            cursor: pointer;
            max-width: 320px;
        }
        
        .s6-settings-panel {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            padding: 12px;
            border-radius: 6px;
            margin: 15px auto;
            width: 95%;
            max-width: 850px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .s6-settings-panel label {
            font-weight: bold;
            color: var(--warning-text);
            font-size: 14px;
        }
        .s6-settings-panel input[type="date"] {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .mode-switch {
            margin: 15px 0;
            padding: 12px;
            background: #f1f8ff;
            border: 1px solid #cce5ff;
            border-radius: 6px;
        }
        .mode-switch label {
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 15px;
            color: var(--primary-color);
        }
        .mode-switch input[type="radio"] {
            transform: scale(1.2);
            margin-right: 5px;
        }
        
        select {
            padding: 10px 14px;
            font-size: 15px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            width: 90%;
            max-width: 420px;
            cursor: pointer;
            margin: 0 auto;
            background: #fff;
        }
        
        .checkbox-container {
            text-align: left;
            margin-top: 10px;
        }
        .checkbox-actions {
            text-align: right;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .checkbox-actions a {
            color: #3498db;
            text-decoration: none;
            margin-left: 10px;
        }
        .checkbox-actions a:hover {
            text-decoration: underline;
        }
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            padding: 15px;
            background: #fafafa;
            border-radius: 4px;
        }
        .item-checkbox {
            display: flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }
        .item-checkbox input {
            margin-right: 8px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
        }
        
        .table-container {
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 10px;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .print-container {
            page-break-inside: avoid;
            break-inside: avoid;
            width: 100%;
        }

        .print-header {
            text-align: left;
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-color);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 800px;
            text-align: center;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px 6px;
            font-size: 13px;
            vertical-align: middle;
            line-height: 1.4;
        }
        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td:first-child, th:first-child {
            background-color: var(--secondary-color);
            color: white;
            font-weight: bold;
            white-space: nowrap;
            position: sticky;
            left: 0;
            z-index: 1;
        }
        th:first-child { z-index: 3; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        tr:hover { background-color: #f1f1f1; }
        .empty-cell { color: #aaa; }
        
        .s6-freed {
            color: #7f8c8d;
            font-size: 12px;
            font-style: italic;
        }
        #statusMessage { margin-top: 8px; font-weight: bold; font-size: 14px; }

        /* ================= 列印專用樣式 (A4 Portrait) ================= */
        @media print {
            .header, .controls, #printActionBar {
                display: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 8mm;
            }
            body {
                background-color: white;
                padding: 0;
                margin: 0;
            }
            .table-container {
                box-shadow: none;
                margin: 0;
                padding: 0;
                width: 100%;
                max-width: 100%;
                overflow: visible !important;
            }
            
            .print-container {
                width: 100% !important;
                transform: none !important;
            }

            .print-header {
                font-size: 16px !important;
                color: black !important;
                border-bottom: 2px solid black;
                margin-top: 0;
                margin-bottom: 6px;
                padding-bottom: 3px;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            table {
                width: 100% !important;
                min-width: auto !important;
                page-break-inside: avoid;
            }
            
            th, td {
                padding: 4px 2px !important;
                font-size: 8px !important;
                border: 1px solid #333 !important;
                word-break: break-all;
            }
            
            th, td:first-child, th:first-child {
                position: static !important;
                font-size: 8px !important;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>校本時間表檢視系統</h1>
        <p>提供教師、班別及房間時間表檢視，支援中六完課動態空堂與共同可用時段分析。</p>
    </div>

    <div class="controls">
        <!-- 頂部類別切換標籤 -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="selectCategory('teacher')">👨‍🏫 教師時間表</button>
            <button class="tab-btn" onclick="selectCategory('class')">🏫 班別時間表</button>
            <button class="tab-btn" onclick="selectCategory('room')">🚪 房間 / 特別室時間表</button>
        </div>

        <div class="upload-row">
            <label for="excelFile"><strong>手動更新檔案：</strong></label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
        <div id="statusMessage" style="color:var(--accent-color);">載入預設時間表中...</div>
        
        <div id="s6Settings" class="s6-settings-panel">
            <label>中六完課日期：
                <input type="date" id="s6GradDate" value="2027-03-01">
            </label>
            <label>目前檢視日期：
                <input type="date" id="viewDate">
            </label>
            <label style="cursor:pointer;">
                <input type="checkbox" id="forceS6Free"> ⚠️ 強制使中六課堂變為空堂
            </label>
        </div>

        <!-- 子模式切換 (單一檢視 / 共同空堂比對) -->
        <div id="modeSelection" class="mode-switch">
            <label><input type="radio" name="mode" value="single" checked onchange="switchMode()"> 檢視單一時間表</label>
            <label><input type="radio" name="mode" value="common" onchange="switchMode()"> 尋找共同空堂 / 可用時段</label>
        </div>

        <div id="singleModeArea">
            <label id="selectLabel" for="itemSelect" style="font-weight:bold; display:block; margin-bottom:10px;">請選擇教師：</label>
            <select id="itemSelect">
                <option value="">-- 請選擇 --</option>
            </select>
        </div>

        <div id="commonModeArea" style="display:none;">
            <div class="checkbox-container">
                <div class="checkbox-actions">
                    <strong id="checkboxLabel">請勾選要比對的項目：</strong>
                    <a href="#" onclick="toggleAllCheckboxes(true); return false;">全部選取</a> | 
                    <a href="#" onclick="toggleAllCheckboxes(false); return false;">全部取消</a>
                </div>
                <div class="checkbox-grid" id="checkboxGrid"></div>
            </div>
            <button class="btn-primary" onclick="renderCommonFree()">開始比對共同空堂</button>
        </div>
    </div>

    <div id="printActionBar" style="display: none; width: 100%; max-width: 1200px; text-align: right; margin-bottom: 10px;">
        <button class="btn-primary" onclick="window.print()" style="background-color: #e67e22; margin-top: 0;">
            🖨️ 列印時間表
        </button>
    </div>

    <div class="table-container" id="tableContainer"></div>

    <script>
        // 三類數據存儲
        const dataset = {
            teacher: {},
            class: {},
            room: {}
        };

        let currentCategory = 'teacher';

        // 自動將「目前檢視日期」設為今天 (查詢當日)
        function setTodayAsViewDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            
            const viewDateInput = document.getElementById('viewDate');
            if (viewDateInput) {
                viewDateInput.value = todayStr;
            }
        }

        // 判斷中六課堂或班別
        function isS6Class(text) {
            if (!text) return false;
            const cleanText = String(text).trim();
            return /6[A-Za-z]|S6|中六/.test(cleanText);
        }

        // 判斷是否為班主任（教師模式專用）
        function isFormTeacher(teacherName) {
            const tGrid = dataset.teacher[teacherName];
            if (!tGrid) return false;
            for (let i = 0; i < tGrid.length; i++) {
                if (tGrid[i] && String(tGrid[i][7] || '').includes('學生培育課')) {
                    return true;
                }
            }
            return false;
        }

        // 判斷中六是否已完課
        function isS6Graduated() {
            if (document.getElementById('forceS6Free').checked) return true;
            
            const gradDateVal = document.getElementById('s6GradDate').value;
            const viewDateVal = document.getElementById('viewDate').value;
            
            if (gradDateVal && viewDateVal) {
                return new Date(viewDateVal) >= new Date(gradDateVal);
            }
            return false;
        }

        document.getElementById('s6GradDate').addEventListener('change', refreshCurrentView);
        document.getElementById('viewDate').addEventListener('change', refreshCurrentView);
        document.getElementById('forceS6Free').addEventListener('change', refreshCurrentView);

        function refreshCurrentView() {
            const currentData = dataset[currentCategory];
            if (Object.keys(currentData).length === 0) return;

            const mode = document.querySelector('input[name="mode"]:checked').value;
            if (mode === 'single') {
                const select = document.getElementById('itemSelect');
                if (select.value) renderTable(currentData[select.value], false, select.value);
            } else {
                const checkboxes = document.querySelectorAll('.cb-item:checked');
                if (checkboxes.length > 0) renderCommonFree();
            }
        }

        // 解析工作簿並存儲至目標分類
        function parseWorkbookToCategory(workbook, targetCat) {
            let count = 0;
            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                const parsedData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});

                let headerIndex = -1;
                for (let i = 0; i < parsedData.length; i++) {
                    if (parsedData[i].some(cell => 
                        String(cell).includes('Day 1') || 
                        String(cell).includes('Day 2') || 
                        String(cell).includes('第1日') || 
                        String(cell).includes('第2日')
                    )) {
                        headerIndex = i;
                        break;
                    }
                }

                if (headerIndex !== -1) {
                    const itemName = sheetName.trim();
                    dataset[targetCat][itemName] = parsedData.slice(headerIndex);
                    count++;
                }
            });
            return count;
        }

        // 頁面載入時設定日期並讀取預設檔案
        window.addEventListener('DOMContentLoaded', async () => {
            // 1. 自動設定查詢日期為今天
            setTodayAsViewDate();

            // 2. 載入預設檔案
            const files = [
                { cat: 'teacher', file: './Teacher_Timetable.xlsx', name: '教師' },
                { cat: 'class', file: './Class_Timetable.xlsx', name: '班別' },
                { cat: 'room', file: './Location_Timetable.xlsx', name: '房間' }
            ];

            const loaded = [];
            for (const item of files) {
                try {
                    const res = await fetch(item.file);
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        const wb = XLSX.read(new Uint8Array(buffer), {type: 'array'});
                        const cnt = parseWorkbookToCategory(wb, item.cat);
                        if (cnt > 0) loaded.push(`${item.name}(${cnt})`);
                    }
                } catch (e) {
                    console.warn(`預設檔案 ${item.file} 讀取略過:`, e);
                }
            }

            if (loaded.length > 0) {
                document.getElementById('statusMessage').innerText = `✅ 已自動載入：${loaded.join('、')}`;
                document.getElementById('statusMessage').style.color = "var(--accent-color)";
            } else {
                document.getElementById('statusMessage').innerText = "未載入預設檔案，請由上方手動匯入 Excel。";
                document.getElementById('statusMessage').style.color = "#856404";
            }

            selectCategory('teacher');
        });

        // 手動匯入檔案處理（自動偵測內容所屬分類）
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('statusMessage').innerText = "正在分析讀取檔案...";
            document.getElementById('statusMessage').style.color = "var(--accent-color)";

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const wb = XLSX.read(data, {type: 'array'});
                    
                    // 根據檔名或當前類別決定匯入分類
                    let target = currentCategory;
                    const fname = file.name.toLowerCase();
                    if (fname.includes('class') || fname.includes('班別')) target = 'class';
                    else if (fname.includes('location') || fname.includes('room') || fname.includes('房間') || fname.includes('特別室')) target = 'room';
                    else if (fname.includes('teacher') || fname.includes('教師')) target = 'teacher';

                    // 清空該類別後載入
                    dataset[target] = {};
                    const count = parseWorkbookToCategory(wb, target);

                    if (count > 0) {
                        document.getElementById('statusMessage').innerText = `✅ 成功匯入 ${count} 筆資料至【${getCategoryName(target)}】！`;
                        selectCategory(target);
                    } else {
                        document.getElementById('statusMessage').innerText = "無法在檔案中找到有效的「第1日 / Day 1」時間表結構。";
                        document.getElementById('statusMessage').style.color = "red";
                    }
                } catch (err) {
                    console.error(err);
                    document.getElementById('statusMessage').innerText = "檔案讀取失敗，請確認檔案格式是否正確。";
                    document.getElementById('statusMessage').style.color = "red";
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function getCategoryName(cat) {
            if (cat === 'teacher') return '教師時間表';
            if (cat === 'class') return '班別時間表';
            return '房間時間表';
        }

        function selectCategory(cat) {
            currentCategory = cat;

            // 更新按鈕樣式
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(cat === 'teacher' ? '教師' : (cat === 'class' ? '班別' : '房間'))) {
                    btn.classList.add('active');
                }
            });

            // 更新標籤提示語
            const labels = {
                teacher: { select: '請選擇一位教師：', checkbox: '請勾選要比對的教師：' },
                class: { select: '請選擇一個班別：', checkbox: '請勾選要比對的班別：' },
                room: { select: '請選擇一個房間 / 特別室：', checkbox: '請勾選要比對的房間：' }
            };

            document.getElementById('selectLabel').innerText = labels[cat].select;
            document.getElementById('checkboxLabel').innerText = labels[cat].checkbox;

            populateDropdownAndCheckboxes();
            switchMode();
        }

        function populateDropdownAndCheckboxes() {
            const select = document.getElementById('itemSelect');
            const checkboxGrid = document.getElementById('checkboxGrid');
            const dataObj = dataset[currentCategory] || {};
            
            select.innerHTML = '<option value="">-- 請選擇 --</option>';
            checkboxGrid.innerHTML = '';
            
            const sortedNames = Object.keys(dataObj).sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));
            
            sortedNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);

                const label = document.createElement('label');
                label.className = 'item-checkbox';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = name;
                cb.className = 'cb-item';
                label.appendChild(cb);
                label.appendChild(document.createTextNode(name));
                checkboxGrid.appendChild(label);
            });

            select.onchange = function() {
                if (this.value) {
                    renderTable(dataObj[this.value], false, `${this.value} - ${getCategoryName(currentCategory)}`);
                } else {
                    document.getElementById('tableContainer').innerHTML = '';
                    document.getElementById('printActionBar').style.display = 'none';
                }
            };
        }

        function switchMode() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('tableContainer').innerHTML = '';
            document.getElementById('printActionBar').style.display = 'none';
            
            if (mode === 'single') {
                document.getElementById('singleModeArea').style.display = 'block';
                document.getElementById('commonModeArea').style.display = 'none';
                document.getElementById('itemSelect').value = '';
            } else {
                document.getElementById('singleModeArea').style.display = 'none';
                document.getElementById('commonModeArea').style.display = 'block';
            }
        }

        function toggleAllCheckboxes(state) {
            document.querySelectorAll('.cb-item').forEach(cb => cb.checked = state);
        }

        // 比對共同空堂 / 可用時段
        function renderCommonFree() {
            const checkboxes = document.querySelectorAll('.cb-item:checked');
            const selectedItems = Array.from(checkboxes).map(cb => cb.value);
            const s6FreeActive = isS6Graduated();
            const dataObj = dataset[currentCategory];
            
            if (selectedItems.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<div style="padding:30px; color:#e74c3c; font-weight:bold; font-size:18px;">請至少勾選一項進行比對！</div>';
                document.getElementById('printActionBar').style.display = 'none';
                return;
            }

            const templateGrid = dataObj[selectedItems[0]];
            const commonGrid = [];
            
            // 教師專用：預取班主任資訊
            const formTeacherStatus = {};
            if (currentCategory === 'teacher') {
                for (let t of selectedItems) {
                    formTeacherStatus[t] = isFormTeacher(t);
                }
            }
            
            templateGrid.forEach((row, rIdx) => {
                if (row.every(cell => String(cell).trim() === '')) return;

                const newRow = [];
                const firstCellData = String(row[1] || '').trim();
                const timeCellData = String(row[0] || '').trim();
                
                const isBreakRow = ['Recess', 'Lunch', '小息', '午膳', '隨後小休'].some(b => firstCellData.includes(b));
                const isMorningAssembly = timeCellData.includes('08:00') && timeCellData.includes('08:15');
                
                row.forEach((cell, cIdx) => {
                    if (rIdx === 0 || cIdx === 0 || isBreakRow) {
                        newRow.push(cell);
                        return;
                    }
                    
                    let isFreeForAll = true;
                    for (let item of selectedItems) {
                        const itmRow = (dataObj[item] && dataObj[item][rIdx]) ? dataObj[item][rIdx] : [];
                        const cellVal = String(itmRow[cIdx] || '').trim();
                        
                        // 教師模式：若為班主任且為課前集會則非空堂
                        if (currentCategory === 'teacher' && isMorningAssembly && formTeacherStatus[item]) {
                            isFreeForAll = false;
                            break;
                        }
                        
                        // 中六完課判斷：若中六課堂已釋放，視為空閒
                        const isFreedSlot = s6FreeActive && (isS6Class(cellVal) || (currentCategory === 'class' && isS6Class(item)));
                        
                        if (cellVal !== '' && !isFreedSlot) {
                            isFreeForAll = false;
                            break;
                        }
                    }
                    
                    if (isFreeForAll) {
                        const freeLabel = currentCategory === 'room' ? '✅ 空置可用' : '✅ 空堂';
                        newRow.push(`<div style="background:#e8f5e9; color:#27ae60; font-weight:bold; padding:6px; border-radius:4px; border:1px solid #a3e4d7;">${freeLabel}</div>`);
                    } else {
                        newRow.push('');
                    }
                });
                commonGrid.push(newRow);
            });
            
            const title = currentCategory === 'room' ? '房間共同空置/可用時段表' : `${getCategoryName(currentCategory)} - 共同空堂表`;
            renderTable(commonGrid, true, title);
        }

        // 表格渲染函式
        function renderTable(rows, isCommonMode = false, titleText = '') {
            const s6FreeActive = isS6Graduated();
            let isFormTeacherFlag = false;
            
            if (!isCommonMode && currentCategory === 'teacher' && titleText) {
                const teacherName = titleText.split(' - ')[0];
                isFormTeacherFlag = isFormTeacher(teacherName);
            }

            let html = '<div class="print-container">'; 
            
            if (titleText) {
                html += `<div class="print-header">${titleText}</div>`;
            }
            
            html += '<table>';
            
            rows.forEach((row, index) => {
                const isEmptyRow = row.every(cell => String(cell).trim() === '');
                if (isEmptyRow) return;

                html += '<tr>';
                row.forEach((cell, cIdx) => {
                    let cellContent = String(cell || '').replace(/\n/g, '<br>');
                    let isS6Vacant = false;

                    const timeCellData = String(row[0] || '').trim();
                    const isMorningAssembly = timeCellData.includes('08:00') && timeCellData.includes('08:15');

                    if (!isCommonMode && currentCategory === 'teacher' && isFormTeacherFlag && cIdx > 0 && isMorningAssembly) {
                        if (!cellContent.trim()) {
                            cellContent = '課前集會';
                        }
                    }

                    // 判斷中六完課釋放標記 (包括中六班別本身或中六課堂)
                    const isS6Item = (!isCommonMode && currentCategory === 'class' && isS6Class(titleText)) || isS6Class(cellContent);
                    if (!isCommonMode && index > 0 && cIdx > 0 && s6FreeActive && isS6Item && cellContent.trim()) {
                        isS6Vacant = true;
                        cellContent = `<div class="s6-freed">中六完課釋放<br><span style="text-decoration:line-through; color:#b2bec3;">${cellContent}</span></div>`;
                    }

                    if (!cellContent.trim()) {
                        cellContent = '<span class="empty-cell">-</span>';
                    }

                    if (index === 0) {
                        html += `<th>${cellContent}</th>`;
                    } else {
                        if (isS6Vacant) {
                            html += `<td style="background-color: #f5f6fa; color: #7f8c8d;">${cellContent}</td>`;
                        } else {
                            html += `<td>${cellContent}</td>`;
                        }
                    }
                });
                html += '</tr>';
            });
            html += '</table></div>';
            
            document.getElementById('tableContainer').innerHTML = html;
            document.getElementById('printActionBar').style.display = 'block';
        }
    </script>
</body>
</html>
